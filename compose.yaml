name: agrozanjir

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    command: [redis-server, /run/secrets/redis_config]
    secrets: [redis_config, redis_password]
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    logging: *logging

  caddy:
    image: caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    user: "10001:10001"
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-agrozanjir.uz}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ${DEPLOY_ROOT:-/opt/agrozanjir}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEPLOY_ROOT:-/opt/agrozanjir}/data/caddy:/data
      - ${DEPLOY_ROOT:-/opt/agrozanjir}/data/caddy-config:/config
      - ${DEPLOY_ROOT:-/opt/agrozanjir}/data/media:/srv/media:ro
    networks: [web]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    # The stock binary carries this file capability; removing it from the bounding
    # set prevents exec itself. Grant only this one capability, never root.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

networks:
  database:
    external: true
    name: ${DB_NETWORK:-infrastructure_database}
  web: {}
  data:
    internal: true

volumes:
  redis-data:

secrets:
  redis_password:
    file: ${DEPLOY_ROOT:-/opt/agrozanjir}/runtime/redis_password
  redis_config:
    file: ${DEPLOY_ROOT:-/opt/agrozanjir}/runtime/redis.conf
