name: agrozanjir

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password, postgres_app_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ${DEPLOY_ROOT:-/opt/agrozanjir}/postgres:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    logging: *logging

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    command: [redis-server, /run/secrets/redis_config]
    secrets: [redis_config, redis_password]
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    logging: *logging

  caddy:
    image: caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    user: "10001:10001"
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-agrozanjir.uz}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ${DEPLOY_ROOT:-/opt/agrozanjir}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEPLOY_ROOT:-/opt/agrozanjir}/data/caddy:/data
      - ${DEPLOY_ROOT:-/opt/agrozanjir}/data/caddy-config:/config
      - ${DEPLOY_ROOT:-/opt/agrozanjir}/data/media:/srv/media:ro
    networks: [web]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    # The stock binary carries this file capability; removing it from the bounding
    # set prevents exec itself. Grant only this one capability, never root.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

networks:
  web:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.40.0/24
        - subnet: fd42:7a:2::/64
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:

secrets:
  postgres_admin_password:
    file: ${DEPLOY_ROOT:-/opt/agrozanjir}/runtime/postgres_admin_password
  postgres_app_password:
    file: ${DEPLOY_ROOT:-/opt/agrozanjir}/runtime/postgres_app_password
  redis_password:
    file: ${DEPLOY_ROOT:-/opt/agrozanjir}/runtime/redis_password
  redis_config:
    file: ${DEPLOY_ROOT:-/opt/agrozanjir}/runtime/redis.conf
