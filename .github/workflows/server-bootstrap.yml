name: server bootstrap
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: server-prod
  queue: max
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
    permissions: {contents: read}
  bootstrap:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      DOMAIN: ${{ vars.DOMAIN || 'agrozanjir.uz' }}
      DB_NETWORK: ${{ vars.DB_NETWORK }}
      RESTIC_REPOSITORY: ${{ vars.RESTIC_REPOSITORY }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: bash scripts/remote.sh bootstrap
      - name: Bootstrap summary
        run: |
          echo '### Server bootstrap completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Application storage and maintenance are ready on the existing Docker host. Deploy infra, backend, then frontend.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Host Docker, PostgreSQL, APT, firewall and SSH settings are managed by the operator.' >> "$GITHUB_STEP_SUMMARY"
