name: Validate infrastructure
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Release and configuration safety tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax and static checks
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
          shellcheck -x -P SCRIPTDIR scripts/*.sh
      - name: Compose validation without production secrets
        run: python3 tests/validate_compose.py
