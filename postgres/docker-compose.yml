# PostgreSQL 16, for a machine without a managed database.
#
#   docker compose -f postgres/docker-compose.yml up -d
#
# The API connects over localhost, so the port is published to 127.0.0.1 only:
# a database reachable from the internet is a database that will be found.

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrozanjir-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agro_zanjir
      POSTGRES_USER: agro
      # CHANGE ME, and put the same value in the backend's DATABASE_URL.
      POSTGRES_PASSWORD: change-me
      # Uzbek, Russian and English in one database.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agrozanjir-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agro_zanjir"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agrozanjir-pgdata:
