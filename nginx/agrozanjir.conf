# Agro Zanjir Digital — nginx
#
# One origin serves both halves: the static bundle at the root, and the API
# under /api/. That is what lets the refresh token stay a SameSite=Lax cookie
# (see the README).
#
# certbot rewrites this file when it installs the certificate. Run
# `certbot --nginx -d agrozanjir.uz` after copying it in, not before.

# CHANGE ME: the domain, in all four places below.
server {
    listen 80;
    listen [::]:80;
    server_name agrozanjir.uz www.agrozanjir.uz;

    # Django redirects to https by itself, but nginx should not make the
    # application answer a request it is only going to bounce.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agrozanjir.uz www.agrozanjir.uz;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/agrozanjir.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/agrozanjir.uz/privkey.pem;

    # A lot passport with photographs attached, and sensor batches coming the
    # other way. The default 1m turns both into a 413.
    client_max_body_size 25m;

    # The compiled bundle. CHANGE ME if /srv is not where it lives.
    root /srv/agrozanjir/web;
    index index.html;

    access_log /var/log/nginx/agrozanjir.access.log;
    error_log  /var/log/nginx/agrozanjir.error.log;

    # --- the single-page app -------------------------------------------
    #
    # Every unknown path becomes index.html. Without this line a reader who
    # reloads on /showroom/melon gets a 404 from nginx: the router only exists
    # once the bundle is running.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints every asset, so they can be cached for a year. The
    # entry document must not be, or a deploy takes a day to reach anyone.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- the API -------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;

        # Django learns the request arrived over TLS from this header, and
        # SECURE_PROXY_SSL_HEADER reads it. Without it every redirect loops.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A sensor batch or a document upload can outlast the default 60s.
        proxy_read_timeout 120s;
    }

    # The operator admin: the manual-adapter surface, and a deliverable.
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }

    # Django's own static files, served by WhiteNoise behind gunicorn. Kept as
    # a proxy rather than an alias so `collectstatic` is the only thing that
    # has to know where they land.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $http_host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded documents. CHANGE ME to match MEDIA_ROOT.
    location /media/ {
        alias /srv/agrozanjir/backend/media/;
        expires 7d;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
